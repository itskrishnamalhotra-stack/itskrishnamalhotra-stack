<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Krishna Malhotra — Applied AI and full-stack developer</title>
  <desc id="desc">Animated systems map representing AI agents, APIs, product engineering, 294 automated tests and 129 application and API routes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#15113a"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c4d7ff" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="nodeGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .reveal{opacity:1;animation:reveal .75s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s)}
    .route{stroke-dasharray:9 13;animation:flow 2.8s linear infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
    .node{animation:pulse 2.4s ease-in-out infinite;animation-delay:var(--delay,0s)}
    .scan{animation:scan 6s linear infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    .role{opacity:0;animation:roles 12s ease-in-out infinite;animation-delay:var(--role,0s)}
    .role.first{opacity:1}
    @keyframes reveal{to{opacity:1;transform:none}}
    @keyframes flow{to{stroke-dashoffset:-44}}
    @keyframes ring{0%{opacity:.8;transform:scale(.72)}75%,100%{opacity:0;transform:scale(1.3)}}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(580px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes roles{0%,4%{opacity:0;transform:translateY(6px)}8%,27%{opacity:1;transform:none}31%,100%{opacity:0;transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.reveal,.role{opacity:1!important;transform:none!important}.role:not(.first){display:none}}
  </style>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="58" r="260" fill="url(#glowA)"/>
  <circle cx="665" cy="555" r="250" fill="url(#glowB)"/>
  <path d="M0 180H1200" stroke="#78cfff" stroke-opacity=".05" class="scan"/>

  <g class="reveal" style="--delay:.08s">
    <circle cx="72" cy="66" r="6" fill="#38bdf8" filter="url(#nodeGlow)"/>
    <text x="90" y="72" fill="#9fb3cc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">SYSTEM / ONLINE</text>
    <text x="518" y="72" fill="#8194ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="end">DELHI · INDIA</text>
  </g>

  <g class="reveal" style="--delay:.18s">
    <text x="70" y="155" fill="#f4f8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="760" letter-spacing="-2">KRISHNA</text>
    <text x="70" y="218" fill="url(#signal)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="760" letter-spacing="-2">MALHOTRA</text>
    <rect x="71" y="239" width="448" height="2" rx="1" fill="url(#signal)" opacity=".72"/>
  </g>

  <g class="reveal" style="--delay:.32s" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <text class="role first" style="--role:0s" x="72" y="288" fill="#c7d7eb">APPLIED AI ENGINEER<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    <text class="role" style="--role:4s" x="72" y="288" fill="#c7d7eb">FULL-STACK PRODUCT BUILDER<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    <text class="role" style="--role:8s" x="72" y="288" fill="#c7d7eb">PYTHON · TYPESCRIPT · AUTOMATION<tspan class="cursor" fill="#38bdf8">_</tspan></text>
  </g>

  <g class="reveal" style="--delay:.48s" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="335" fill="#8fa5bf" font-size="18">I turn real workflows into shipped software:</text>
    <text x="72" y="365" fill="#d6e4f5" font-size="18">AI agents, APIs, operational platforms and production interfaces.</text>
  </g>

  <g class="reveal" style="--delay:.62s">
    <rect x="70" y="410" width="144" height="78" rx="14" fill="#0d1b31" stroke="#38bdf8" stroke-opacity=".35"/>
    <text x="88" y="444" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">294</text>
    <text x="88" y="469" fill="#8fa5bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">AUTOMATED TESTS</text>
    <rect x="228" y="410" width="144" height="78" rx="14" fill="#0d1b31" stroke="#a78bfa" stroke-opacity=".35"/>
    <text x="246" y="444" fill="#c4b5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">129</text>
    <text x="246" y="469" fill="#8fa5bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">APP + API ROUTES</text>
    <rect x="386" y="410" width="134" height="78" rx="14" fill="#0d1b31" stroke="#fbbf24" stroke-opacity=".3"/>
    <text x="404" y="444" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">SHIP</text>
    <text x="404" y="469" fill="#8fa5bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">IDEA → PRODUCT</text>
  </g>

  <g class="reveal" style="--delay:.38s">
    <path d="M678 160C752 92 873 93 938 168" fill="none" stroke="#38bdf8" stroke-opacity=".54" stroke-width="2" class="route"/>
    <path d="M938 168C1008 218 1014 333 948 386" fill="none" stroke="#a78bfa" stroke-opacity=".52" stroke-width="2" class="route"/>
    <path d="M948 386C862 465 729 437 675 346" fill="none" stroke="#38bdf8" stroke-opacity=".48" stroke-width="2" class="route"/>
    <path d="M675 346C627 276 630 205 678 160" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-width="2" class="route"/>
    <path d="M678 160L815 274L938 168M815 274L948 386M815 274L675 346" fill="none" stroke="#dcecff" stroke-opacity=".16" stroke-width="1.5"/>

    <circle cx="815" cy="274" r="86" fill="#0b1931" stroke="url(#signal)" stroke-width="2"/>
    <circle cx="815" cy="274" r="104" fill="none" stroke="#38bdf8" stroke-opacity=".32" class="ring"/>
    <circle cx="815" cy="274" r="67" fill="none" stroke="#dbeafe" stroke-opacity=".1" stroke-dasharray="3 8"/>
    <text x="815" y="263" text-anchor="middle" fill="#f4f8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="760">BUILD</text>
    <text x="815" y="293" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">WORKFLOW → SOFTWARE</text>

    <g class="node" style="--delay:.2s">
      <circle cx="678" cy="160" r="42" fill="#0b1c34" stroke="#38bdf8" stroke-width="2"/>
      <text x="678" y="166" text-anchor="middle" fill="#dff4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">PY</text>
      <text x="678" y="215" text-anchor="middle" fill="#7088a4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">SERVICES</text>
    </g>
    <g class="node" style="--delay:.7s">
      <circle cx="938" cy="168" r="42" fill="#16183b" stroke="#a78bfa" stroke-width="2"/>
      <text x="938" y="174" text-anchor="middle" fill="#eee9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">TS</text>
      <text x="938" y="223" text-anchor="middle" fill="#7088a4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">PRODUCT</text>
    </g>
    <g class="node" style="--delay:1.1s">
      <circle cx="948" cy="386" r="42" fill="#0b1c34" stroke="#38bdf8" stroke-width="2"/>
      <text x="948" y="392" text-anchor="middle" fill="#dff4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">API</text>
      <text x="948" y="441" text-anchor="middle" fill="#7088a4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">SYSTEMS</text>
    </g>
    <g class="node" style="--delay:1.5s">
      <circle cx="675" cy="346" r="42" fill="#16183b" stroke="#a78bfa" stroke-width="2"/>
      <text x="675" y="352" text-anchor="middle" fill="#eee9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">AI</text>
      <text x="675" y="401" text-anchor="middle" fill="#7088a4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">AGENTS</text>
    </g>
  </g>

  <g class="reveal" style="--delay:.8s">
    <path d="M570 518H1130" stroke="#82a0c4" stroke-opacity=".18"/>
    <circle cx="590" cy="518" r="4" fill="#38bdf8"/>
    <text x="608" y="524" fill="#8197b1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">AVAILABLE FOR PRODUCT ENGINEERING · AI · BACKEND COLLABORATION</text>
  </g>
</svg>

